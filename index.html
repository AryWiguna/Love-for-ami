<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Love untuk amii</title>
    <meta name="description" content="Sebuah kejutan kecil penuh cinta, khusus untuk Ami 💗">
    <meta name="theme-color" content="#000000">
    <!-- Tampilan saat link dibagikan (WhatsApp, IG, dll) -->
    <meta property="og:title" content="Love untuk amii 💌">
    <meta property="og:description" content="Ada sesuatu yang spesial buat kamu… buka ya ❤">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💗</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* Reset margin dan padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Memastikan background fullscreen hitam dan tidak bisa di-scroll */
        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Canvas utama (bintang + hati) & canvas efek (partikel) */
        #heartCanvas,
        #fxCanvas {
            position: fixed;
            top: 0;
            left: 0;
            display: block;
        }

        #fxCanvas {
            pointer-events: none;
            z-index: 20;
        }

        /* ===== Photo Card (kartu gosok) ===== */
        #photoCard {
            position: absolute;
            z-index: 10;
            border-radius: 18px;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 25px rgba(255, 0, 60, 0.55), 0 0 60px rgba(255, 0, 60, 0.25);
            background: #1a0008;
            opacity: 0;
            transform: translateY(-25px) scale(0.9);
            transition: opacity 0.9s ease, transform 0.9s cubic-bezier(.2, .9, .3, 1.2);
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #photoCard.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        /* Glow berdenyut setelah foto terbuka */
        #photoCard.revealed {
            animation: cardGlow 2.2s ease-in-out infinite;
        }

        @keyframes cardGlow {

            0%,
            100% {
                box-shadow: 0 0 25px rgba(255, 0, 60, 0.55), 0 0 60px rgba(255, 0, 60, 0.25);
            }

            50% {
                box-shadow: 0 0 40px rgba(255, 30, 80, 0.85), 0 0 90px rgba(255, 0, 60, 0.45);
            }
        }

        #photoImg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            -webkit-user-drag: none;
        }

        /* Tulisan kecil di bawah foto, muncul setelah kartu terbuka */
        #caption {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 30px 12px 8px;
            text-align: center;
            font-family: 'Dancing Script', cursive;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent);
            text-shadow: 0 0 10px rgba(255, 60, 100, 0.9);
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 1s ease 0.4s, transform 1s ease 0.4s;
            pointer-events: none;
        }

        #photoCard.revealed #caption {
            opacity: 1;
            transform: translateY(0);
        }

        /* Lapisan yang harus diusap */
        #scratchCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: grab;
            transition: opacity 0.8s ease;
        }

        #scratchCanvas.cleared {
            opacity: 0;
            pointer-events: none;
        }

        /* ===== Layar pembuka ===== */
        #intro {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, rgba(70, 0, 25, 0.5), rgba(0, 0, 0, 0.92) 70%);
            transition: opacity 1.1s ease, visibility 1.1s;
        }

        #intro.hide {
            opacity: 0;
            visibility: hidden;
        }

        .intro-inner {
            text-align: center;
            padding: 36px 30px;
            max-width: min(88vw, 380px);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 0 60px rgba(255, 0, 60, 0.18);
            animation: floatIn 1.2s cubic-bezier(.2, .9, .3, 1) both;
        }

        .envelope {
            font-size: 54px;
            display: inline-block;
            animation: bob 2.4s ease-in-out infinite;
            filter: drop-shadow(0 0 14px rgba(255, 60, 100, 0.6));
        }

        .intro-inner h1 {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(40px, 11vw, 58px);
            color: #ff4d6d;
            text-shadow: 0 0 18px rgba(255, 0, 60, 0.7);
            margin: 8px 0 6px;
        }

        .intro-inner p {
            color: rgba(255, 255, 255, 0.75);
            font-weight: 300;
            font-size: 15px;
            margin-bottom: 26px;
        }

        #startBtn {
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 500;
            color: #fff;
            border: none;
            cursor: pointer;
            padding: 13px 36px;
            border-radius: 999px;
            background: linear-gradient(135deg, #ff4d6d, #c9184a);
            box-shadow: 0 8px 30px rgba(255, 0, 60, 0.45);
            animation: pulseBtn 1.8s ease-in-out infinite;
            transition: transform 0.2s ease;
        }

        #startBtn:hover {
            transform: scale(1.06);
        }

        #startBtn:active {
            transform: scale(0.96);
        }

        @keyframes bob {

            0%,
            100% {
                transform: translateY(0) rotate(-4deg);
            }

            50% {
                transform: translateY(-8px) rotate(4deg);
            }
        }

        @keyframes pulseBtn {

            0%,
            100% {
                box-shadow: 0 8px 30px rgba(255, 0, 60, 0.45);
            }

            50% {
                box-shadow: 0 8px 46px rgba(255, 0, 60, 0.8);
            }
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        /* Tombol ulangi (muncul setelah foto terbuka) */
        #replayBtn {
            position: fixed;
            right: 16px;
            bottom: calc(16px + env(safe-area-inset-bottom));
            z-index: 25;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease, transform 0.3s ease, background 0.3s ease;
        }

        #replayBtn.show {
            opacity: 0.75;
            pointer-events: auto;
        }

        #replayBtn:hover {
            opacity: 1;
            background: rgba(255, 77, 109, 0.35);
            transform: rotate(-90deg);
        }
    </style>
</head>

<body>
    <canvas id="heartCanvas"></canvas>

    <!-- Kartu foto: simpan foto dengan nama "foto.jpg" di folder yang sama dengan file ini -->
    <div id="photoCard">
        <img id="photoImg" src="foto.jpg" alt="Foto spesial" draggable="false">
        <div id="caption">Untukmu, Ami 💗</div>
        <canvas id="scratchCanvas"></canvas>
    </div>

    <canvas id="fxCanvas"></canvas>

    <!-- Layar pembuka -->
    <div id="intro">
        <div class="intro-inner">
            <div class="envelope">💌</div>
            <h1>Untuk Ami</h1>
            <p>Ada sesuatu yang spesial buat kamu…</p>
            <button id="startBtn" type="button">Buka ❤</button>
        </div>
    </div>

    <button id="replayBtn" type="button" aria-label="Ulangi dari awal" title="Ulangi">↻</button>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        const fx = document.getElementById('fxCanvas');
        const fctx = fx.getContext('2d');

        const card = document.getElementById('photoCard');
        const caption = document.getElementById('caption');
        const scratchCanvas = document.getElementById('scratchCanvas');
        const sctx = scratchCanvas.getContext('2d');
        const intro = document.getElementById('intro');
        const startBtn = document.getElementById('startBtn');
        const replayBtn = document.getElementById('replayBtn');

        let width, height, dpr = 1;

        // Minimal 15 variasi terjemahan frasa "I love you"
        const phrases = [
            "I love you",       // English
            "Te amo",           // Spanish
            "Aku cinta kamu",   // Indonesian
            "Seni seviyorum",   // Turkish
            "Saranghae",        // Korean
            "Je t'aime",        // French
            "Ich liebe dich",   // German
            "Ti amo",           // Italian
            "Ya tebya lyublyu", // Russian
            "Aishiteru",        // Japanese
            "Wǒ ài nǐ",         // Chinese
            "Mahal kita",       // Tagalog
            "Eu te amo",        // Portuguese
            "S'agapo",          // Greek
            "Szeretlek"         // Hungarian
        ];

        // Lapisan hati dari terluar (1.0) hingga ke tengah (0.1)
        const layerRadii = [1.0, 0.85, 0.7, 0.55, 0.4, 0.25, 0.1];
        const pointsPerLayer = [90, 75, 60, 45, 30, 15, 5];
        // Kecepatan per lapis: lapis terluar tetap santai, makin ke tengah makin cepat
        const layerSpeeds = [0.25, 0.32, 0.42, 0.55, 0.7, 0.85, 1.0];

        let pathPoints = [];
        let drawIndex = 0;

        // Status animasi: 'intro' -> 'drawing' -> 'pause' -> 'moving' -> 'done'
        let phase = 'intro';
        let pauseFrames = 0;
        let moveProgress = 0;
        let doneTime = 0;

        // Ukuran & posisi layout
        let fullLayout, finalLayout;
        let cardW = 0, cardH = 0, cardShown = false;

        // Gambar hati yang sudah jadi disimpan agar animasi detak jantung tetap ringan
        let heartCache = null;

        // Efek latar & partikel
        let stars = [];
        let floaters = [];
        let particles = [];
        let lastTs = 0;

        /* ================= TITIK-TITIK HATI ================= */
        function buildPoints() {
            pathPoints = [];
            for (let l = 0; l < layerRadii.length; l++) {
                const r = layerRadii[l];
                const pCount = pointsPerLayer[l];

                // i < pCount (bukan <=) agar titik awal & akhir tidak dobel di posisi yang sama
                for (let i = 0; i < pCount; i++) {
                    // t bergerak dari 0 sampai 2*PI untuk merangkai satu lapis bentuk hati
                    const t = (i / pCount) * Math.PI * 2;

                    const xRaw = 16 * Math.pow(Math.sin(t), 3);
                    const yRaw = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)); // Dinegasikan

                    pathPoints.push({
                        xRaw: xRaw * r, // Sesuaikan skala dengan radius layer
                        yRaw: yRaw * r,
                        phrase: phrases[Math.floor(Math.random() * phrases.length)],
                        fontSize: Math.random() * 4 + 11, // Ukuran font
                        layer: l
                    });
                }
            }
        }

        /* ================= LAYOUT ================= */
        // Hitung layout awal (hati di tengah) & layout akhir (kartu di atas, hati di bawah)
        function computeLayouts() {
            // Layout awal: hati besar di tengah layar
            fullLayout = { cx: width / 2, cy: height / 2, scale: Math.min(width, height) / 45 };

            // Ukuran kartu (rasio ~1.45 sesuai proporsi foto asli). Dikunci setelah kartu tampil agar hasil usapan tidak hilang.
            if (!cardShown) {
                const maxCardW = Math.min(width * 0.88, 380);
                const maxCardH = Math.min(height * 0.35, 245);
                const targetRatio = 1.45;
                if (maxCardW / targetRatio <= maxCardH) {
                    cardW = maxCardW;
                    cardH = cardW / targetRatio;
                } else {
                    cardH = maxCardH;
                    cardW = cardH * targetRatio;
                }
            }

            const cardTop = 20;
            const gap = 28; // jarak aman antara kartu & hati
            const heartTop = cardTop + cardH + gap;
            const regionH = Math.max(80, height - heartTop - 16);

            // Bentuk hati kira-kira setinggi 29 unit (y: -12 s/d 17) & selebar 32 unit (+ ruang teks)
            const s = Math.min(regionH / 30, (width - 140) / 32, fullLayout.scale);
            finalLayout = {
                cx: width / 2,
                cy: heartTop + 12 * s + Math.max(0, (regionH - 29 * s) / 2),
                scale: s
            };

            // Posisikan kartu di tengah atas
            card.style.width = cardW + 'px';
            card.style.height = cardH + 'px';
            card.style.left = (width - cardW) / 2 + 'px';
            card.style.top = cardTop + 'px';
        }

        function buildStars() {
            const n = Math.min(160, Math.round((width * height) / 9000));
            stars = [];
            for (let i = 0; i < n; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 1.2 + 0.3,
                    tw: Math.random() * Math.PI * 2,
                    sp: Math.random() * 0.03 + 0.01
                });
            }
        }

        // Responsif terhadap perubahan ukuran layar (canvas tajam di layar HP/retina)
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            dpr = Math.min(window.devicePixelRatio || 1, 2);

            for (const c of [canvas, fx]) {
                c.width = Math.round(width * dpr);
                c.height = Math.round(height * dpr);
                c.style.width = width + 'px';
                c.style.height = height + 'px';
            }
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            fctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            computeLayouts();
            buildStars();
            if (phase === 'done') buildHeartCache();
        }

        /* ================= MENGGAMBAR HATI ================= */
        // Easing halus untuk transisi pergeseran hati
        function easeInOut(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function currentLayout() {
            const e = easeInOut(moveProgress);
            return {
                cx: fullLayout.cx + (finalLayout.cx - fullLayout.cx) * e,
                cy: fullLayout.cy + (finalLayout.cy - fullLayout.cy) * e,
                scale: fullLayout.scale + (finalLayout.scale - fullLayout.scale) * e
            };
        }

        // Gambar kalimat-kalimat hati pada layout tertentu
        function drawHeartText(c, L, limit, di) {
            c.textAlign = 'center';
            c.textBaseline = 'middle';

            // Efek warna dan bersinar (glow)
            c.fillStyle = '#ff0000';
            c.shadowColor = '#ff0000';
            c.shadowBlur = 8 * dpr;

            // Font ikut mengecil sedikit saat hati mengecil
            const fontFactor = Math.max(0.75, L.scale / fullLayout.scale);

            for (let i = 0; i < limit; i++) {
                const p = pathPoints[i];

                // Efek fade-in untuk kalimat yang baru saja ditambahkan
                c.globalAlpha = Math.min(1, (di - i) / 3);
                c.font = `bold ${p.fontSize * fontFactor}px Arial`;
                c.fillText(p.phrase, L.cx + p.xRaw * L.scale, L.cy + p.yRaw * L.scale);
            }
            c.globalAlpha = 1;
            c.shadowBlur = 0;
        }

        // Simpan gambar hati final ke canvas tersembunyi
        function buildHeartCache() {
            heartCache = document.createElement('canvas');
            heartCache.width = Math.round(width * dpr);
            heartCache.height = Math.round(height * dpr);
            const hc = heartCache.getContext('2d');
            hc.setTransform(dpr, 0, 0, dpr, 0, 0);
            drawHeartText(hc, finalLayout, pathPoints.length, pathPoints.length + 10);
        }

        // Skala detak jantung ganda (lub-dub) dengan siklus 1.3 detik
        function heartbeat(t) {
            const p = (t % 1300) / 1300;
            const b1 = Math.exp(-Math.pow((p - 0.30) / 0.045, 2));
            const b2 = Math.exp(-Math.pow((p - 0.47) / 0.05, 2));
            return 1 + 0.035 * b1 + 0.022 * b2;
        }

        /* ================= LATAR: BINTANG & HATI MELAYANG ================= */
        function drawBackground(k) {
            ctx.fillStyle = '#ffd6e0';
            for (const s of stars) {
                s.tw += s.sp * k;
                ctx.globalAlpha = 0.15 + 0.5 * (0.5 + 0.5 * Math.sin(s.tw));
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            }

            // Hati kecil transparan yang melayang naik perlahan
            if (floaters.length < 14 && Math.random() < 0.03 * k) {
                floaters.push({
                    x: Math.random() * width,
                    y: height + 20,
                    size: 10 + Math.random() * 14,
                    vy: 0.3 + Math.random() * 0.5,
                    drift: Math.random() * Math.PI * 2,
                    alpha: 0.08 + Math.random() * 0.17
                });
            }
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ff4d6d';
            for (let i = floaters.length - 1; i >= 0; i--) {
                const f = floaters[i];
                f.y -= f.vy * k;
                f.drift += 0.01 * k;
                f.x += Math.sin(f.drift) * 0.3 * k;
                if (f.y < -30) { floaters.splice(i, 1); continue; }
                ctx.globalAlpha = f.alpha;
                ctx.font = `${f.size}px Arial`;
                ctx.fillText('♥', f.x, f.y);
            }
            ctx.globalAlpha = 1;
        }

        /* ================= PARTIKEL EFEK ================= */
        const particleColors = ['#ff4d6d', '#ff8fa3', '#ffffff', '#ff0a54', '#ffc2d1'];

        function spawnParticle(p) {
            if (particles.length > 400) return;
            particles.push(Object.assign({ life: 0, rot: 0, vr: (Math.random() - 0.5) * 0.1, g: 0 }, p));
        }

        // Ledakan hati & kilau saat foto terbuka
        function burst(x, y) {
            for (let i = 0; i < 46; i++) {
                const a = Math.random() * Math.PI * 2;
                const sp = 2 + Math.random() * 5;
                spawnParticle({
                    type: Math.random() < 0.6 ? 'heart' : 'spark',
                    x, y,
                    vx: Math.cos(a) * sp,
                    vy: Math.sin(a) * sp - 1.5,
                    g: 0.06,
                    size: 10 + Math.random() * 14,
                    color: particleColors[Math.floor(Math.random() * particleColors.length)],
                    max: 70 + Math.random() * 40
                });
            }
        }

        // Hati kecil yang muncul saat layar diketuk
        function tapHearts(x, y) {
            for (let i = 0; i < 6; i++) {
                spawnParticle({
                    type: 'heart',
                    x, y,
                    vx: (Math.random() - 0.5) * 1.6,
                    vy: -1 - Math.random() * 1.5,
                    g: -0.01,
                    size: 12 + Math.random() * 10,
                    color: particleColors[Math.floor(Math.random() * 4)],
                    max: 80
                });
            }
        }

        // Kilau kecil di ujung jari saat mengusap kartu
        function sparkle(x, y) {
            spawnParticle({
                type: 'spark',
                x, y,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2 - 0.5,
                size: 2 + Math.random() * 1.5,
                color: Math.random() < 0.5 ? '#ffffff' : '#ffc2d1',
                max: 30
            });
        }

        function updateParticles(k) {
            fctx.clearRect(0, 0, width, height);
            if (!particles.length) return;
            fctx.textAlign = 'center';
            fctx.textBaseline = 'middle';
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life += k;
                if (p.life >= p.max) { particles.splice(i, 1); continue; }
                p.vy += p.g * k;
                p.x += p.vx * k;
                p.y += p.vy * k;
                p.rot += p.vr * k;
                const a = 1 - p.life / p.max;
                fctx.globalAlpha = a;
                fctx.fillStyle = p.color;
                if (p.type === 'heart') {
                    fctx.save();
                    fctx.translate(p.x, p.y);
                    fctx.rotate(p.rot);
                    fctx.font = `${p.size}px Arial`;
                    fctx.fillText('♥', 0, 0);
                    fctx.restore();
                } else {
                    fctx.beginPath();
                    fctx.arc(p.x, p.y, Math.max(0.5, (p.type === 'spark' && p.size > 5 ? 3 : p.size) * a), 0, Math.PI * 2);
                    fctx.fill();
                }
            }
            fctx.globalAlpha = 1;
        }

        /* ================= LOOP ANIMASI UTAMA ================= */
        function frame(ts) {
            // k = faktor waktu, agar kecepatan sama di layar 60Hz maupun 120Hz
            const dt = lastTs ? ts - lastTs : 16.67;
            lastTs = ts;
            const k = Math.min(3, dt / 16.67);

            ctx.clearRect(0, 0, width, height);
            drawBackground(k);

            if (phase === 'drawing' || phase === 'pause' || phase === 'moving') {
                const limit = Math.min(Math.floor(drawIndex), pathPoints.length);
                drawHeartText(ctx, currentLayout(), limit, drawIndex);
            } else if (phase === 'done' && heartCache) {
                // Hati berdetak pelan seperti jantung
                const s = heartbeat(ts - doneTime);
                ctx.save();
                ctx.translate(finalLayout.cx, finalLayout.cy);
                ctx.scale(s, s);
                ctx.translate(-finalLayout.cx, -finalLayout.cy);
                ctx.drawImage(heartCache, 0, 0, width, height);
                ctx.restore();
            }

            if (phase === 'drawing') {
                // Kecepatan mengikuti lapis yang sedang digambar (tengah lebih cepat)
                const idx = Math.min(Math.floor(drawIndex), pathPoints.length - 1);
                drawIndex += layerSpeeds[pathPoints[idx].layer] * k;
                if (drawIndex >= pathPoints.length + 3) phase = 'pause';
            } else if (phase === 'pause') {
                // Jeda sejenak agar hati penuh bisa dinikmati
                pauseFrames += k;
                if (pauseFrames > 60) phase = 'moving';
            } else if (phase === 'moving') {
                // Hati bergeser ke bawah & mengecil untuk memberi ruang kartu foto
                moveProgress = Math.min(1, moveProgress + 0.012 * k);
                if (moveProgress >= 1) {
                    phase = 'done';
                    doneTime = ts;
                    buildHeartCache();
                    showCard();
                }
            }

            updateParticles(k);
            requestAnimationFrame(frame);
        }

        /* ================= LAYAR PEMBUKA ================= */
        function start() {
            if (phase !== 'intro') return;
            intro.classList.add('hide');
            phase = 'drawing';
        }
        startBtn.addEventListener('click', start);
        intro.addEventListener('click', start);

        /* ================= KARTU GOSOK ================= */
        let isScratching = false;
        let lastPt = null;
        let revealed = false;
        let moveCount = 0;

        function showCard() {
            cardShown = true;
            setupScratch();
            caption.style.fontSize = Math.max(18, Math.round(cardH / 8)) + 'px';
            card.classList.add('show');
        }

        // Gambar lapisan penutup yang harus diusap
        function setupScratch() {
            const sd = window.devicePixelRatio || 1;
            scratchCanvas.width = cardW * sd;
            scratchCanvas.height = cardH * sd;
            sctx.setTransform(sd, 0, 0, sd, 0, 0);

            // Latar gradasi merah muda
            const g = sctx.createLinearGradient(0, 0, cardW, cardH);
            g.addColorStop(0, '#ff4d6d');
            g.addColorStop(0.5, '#e01e5a');
            g.addColorStop(1, '#8a0a2e');
            sctx.fillStyle = g;
            sctx.fillRect(0, 0, cardW, cardH);

            // Pola hati kecil
            sctx.fillStyle = 'rgba(255,255,255,0.13)';
            sctx.textAlign = 'center';
            sctx.textBaseline = 'middle';
            sctx.font = '16px Arial';
            for (let y = 14; y < cardH; y += 30) {
                for (let x = ((y / 30) % 2 ? 10 : 25); x < cardW; x += 30) {
                    sctx.fillText('♥', x, y);
                }
            }

            // Teks petunjuk
            sctx.fillStyle = '#fff';
            sctx.shadowColor = 'rgba(0,0,0,0.45)';
            sctx.shadowBlur = 8;
            sctx.font = `bold ${Math.round(cardH / 7.5)}px Arial`;
            sctx.fillText('Usap aku ✨', cardW / 2, cardH / 2 - cardH / 10);
            sctx.font = `${Math.round(cardH / 5.2)}px Arial`;
            sctx.fillText('💕', cardW / 2, cardH / 2 + cardH / 6);
            sctx.shadowBlur = 0;
        }

        function getPoint(e) {
            const rect = scratchCanvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        function scratchTo(pt) {
            sctx.globalCompositeOperation = 'destination-out';
            sctx.lineWidth = Math.max(34, cardH / 4.8);
            sctx.lineCap = 'round';
            sctx.lineJoin = 'round';
            sctx.beginPath();
            sctx.moveTo((lastPt || pt).x, (lastPt || pt).y);
            sctx.lineTo(pt.x, pt.y);
            sctx.stroke();
            sctx.globalCompositeOperation = 'source-over';
            lastPt = pt;

            // Cek persentase area yang sudah terusap (tidak setiap gerakan agar ringan)
            if (++moveCount % 8 === 0) checkReveal();
        }

        function checkReveal() {
            if (revealed) return;
            const data = sctx.getImageData(0, 0, scratchCanvas.width, scratchCanvas.height).data;
            let cleared = 0, total = 0;
            for (let i = 3; i < data.length; i += 4 * 24) {
                total++;
                if (data[i] === 0) cleared++;
            }
            // Jika sudah lebih dari 55% terusap, buka foto sepenuhnya
            if (cleared / total > 0.55) reveal();
        }

        function reveal() {
            revealed = true;
            isScratching = false;
            scratchCanvas.classList.add('cleared');
            card.classList.add('revealed');

            const r = card.getBoundingClientRect();
            burst(r.left + r.width / 2, r.top + r.height / 2);
            if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
            setTimeout(() => replayBtn.classList.add('show'), 1500);
        }

        scratchCanvas.addEventListener('pointerdown', (e) => {
            isScratching = true;
            lastPt = null;
            scratchCanvas.setPointerCapture(e.pointerId);
            scratchTo(getPoint(e));
            sparkle(e.clientX, e.clientY);
        });
        scratchCanvas.addEventListener('pointermove', (e) => {
            if (!isScratching) return;
            scratchTo(getPoint(e));
            if (Math.random() < 0.6) sparkle(e.clientX, e.clientY);
        });
        const stopScratch = () => { isScratching = false; lastPt = null; checkReveal(); };
        scratchCanvas.addEventListener('pointerup', stopScratch);
        scratchCanvas.addEventListener('pointercancel', stopScratch);

        /* ================= INTERAKSI TAMBAHAN ================= */
        // Ketuk di mana saja (setelah hati jadi) untuk memunculkan hati kecil
        window.addEventListener('pointerdown', (e) => {
            if (phase !== 'done') return;
            if (e.target === scratchCanvas || e.target.closest('button')) return;
            tapHearts(e.clientX, e.clientY);
        });

        replayBtn.addEventListener('click', () => location.reload());

        /* ================= JALANKAN ================= */
        resize();
        buildPoints();
        window.addEventListener('resize', resize);
        requestAnimationFrame(frame);

    </script>
</body>

</html>
